name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Packages and Publish Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-4-dev libgphoto2-dev binutils rpm zstd

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust binary (release)
        run: cargo build --release

      - name: Build Debian (.deb) package
        run: ./packaging/deb/build-deb.sh

      - name: Build Standalone Binary Tarball (.tar.gz)
        run: |
          mkdir -p dist/lenvix-${{ github.ref_name }}-linux-x86_64/{bin,share/applications,share/icons/hicolor/scalable/apps}
          cp target/release/lenvix dist/lenvix-${{ github.ref_name }}-linux-x86_64/bin/
          cp assets/io.github.eulucastiagolt.lenvix.desktop dist/lenvix-${{ github.ref_name }}-linux-x86_64/share/applications/
          cp assets/io.github.eulucastiagolt.lenvix.svg dist/lenvix-${{ github.ref_name }}-linux-x86_64/share/icons/hicolor/scalable/apps/
          cp README.md dist/lenvix-${{ github.ref_name }}-linux-x86_64/
          cat << 'EOF' > dist/lenvix-${{ github.ref_name }}-linux-x86_64/install.sh
          #!/bin/sh
          set -e
          PREFIX="${PREFIX:-/usr/local}"
          echo "Installing Lenvix to $PREFIX..."
          install -Dm755 bin/lenvix "$PREFIX/bin/lenvix"
          install -Dm644 share/applications/io.github.eulucastiagolt.lenvix.desktop "$PREFIX/share/applications/io.github.eulucastiagolt.lenvix.desktop"
          install -Dm644 share/icons/hicolor/scalable/apps/io.github.eulucastiagolt.lenvix.svg "$PREFIX/share/icons/hicolor/scalable/apps/io.github.eulucastiagolt.lenvix.svg"
          echo "Lenvix installed successfully!"
          EOF
          chmod +x dist/lenvix-${{ github.ref_name }}-linux-x86_64/install.sh
          tar -czf dist/lenvix-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist lenvix-${{ github.ref_name }}-linux-x86_64

      - name: Build AppImage (.AppImage)
        run: ./packaging/appimage/build-appimage.sh

      - name: Build RPM package (.rpm)
        run: ./packaging/rpm/build-rpm.sh

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Lenvix ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.pkg.tar.zst
